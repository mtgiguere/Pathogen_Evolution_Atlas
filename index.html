<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathogen Evolution Atlas </title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  .figure {
    border-top: 1.5px solid #090909;
    border-left: 1.5px solid #090909;
    padding: 20px 24px;
  }
  h2 { margin-bottom: 4px; }
  .row { margin: 12px 0; }
  .label { font-weight: bold; margin-bottom: 4px; }
  .bar {
    height: 28px;
    background: #4a90d9;
    color: white;
    border-radius: 4px;
    display: flex;
    align-items: center;
    padding-left: 8px;
    box-sizing: border-box;
    white-space: nowrap;
  }
  .bar-cousin { background: #85c35f; }
  .legend { 
    font-size: 14px;
    color: #090909;
    border-bottom: 1px solid #090909;
    padding: 0 24px 16px 24px;
    margin: 0 -24px 20px -24px;
  }
  .swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 4px;
    margin-left: 12px;
  }
  .swatch-xfg { background: #4a90d9; }
  .swatch-cousin { background: #85c35f; }
  #output { margin-top: 8px; }
  .caption { 
    font-size: 14px;
    color: #090909;
    line-height: 1.5;
    max-width: 600px;
    border-top: 1px solid #090909;
    padding: 16px 24px 0 24px;
    margin: 20px -24px 0 -24px;
  }
  #figures {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin-top: 20px;
    border-right: 1.5px solid #090909;
    border-bottom: 1.5px solid #090909;
  }
  .fignum {
    display: inline-block;
    background: #4a90d9;
    color: white;
    font-weight: bold;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    text-align: center;
    line-height: 24px;
    margin-bottom: 8px;
  }
  .bar-ancestral { background: #d9d2c5; color: #444444; }
  .swatch-ancestral { background: #d9d2c5; }
  .grid-legend { font-size: 14px; color:#090909; margin: 8px 0 16px 0; }
</style>
</head>
<body>
<h1>Pathogen Evolution Atlas</h1>
<p class="intro">XFG's distinguishing spike mutations versus its closest relatives (PQ, NB).</p>

<div class="grid-legend">
  <span class="swatch swatch-xfg"></span> XFG (mutation present)
  <span class="swatch swatch-cousin"></span> PQ / NB (mutation present)
  <span class="swatch swatch-ancestral"></span> Ancestral residue (no change)
</div>

<div id="figures"></div>

<script>
  fetch("data/site/residues.json")
    .then(response => response.json())
    .then(data => {
      const figures = document.getElementById("figures");
      figures.innerHTML = "";
      const positions = [487, 445, 478, 346, 444];
      positions.forEach((pos, index) => {
        drawCard(index + 1, pos, data);
      });
    })
    .catch(error => {
      document.getElementById("figures").innerHTML = "Error: " + error;
    });

  function dominant(changes) {
    if (changes.length === 0) {
      return null;
    }
    let top = changes[0];
    for (const item of changes) {
      if (item.pct > top.pct) {
        top = item;
      }
    }
    return top;
  }
  function ancestralPct(changes) {
    let sum = 0
    for (const item of changes) {
      sum += item.pct;
    }
    return Math.round((100 - sum) / 10);
  }

  function drawCard(figNum, position, data) {
    const posData = data[position];
    const figures = document.getElementById("figures");
    const card = document.createElement("div");
    card.className = "figure";

    let html = '<div class="fignum">' + figNum + '</div>';
    html += '<div class="label">Position ' + position + '</div>';

    for (const family of ["XFG", "PQ", "NB"]) {
      const changes = posData[family].changes;
      const topChange = dominant(changes);
      const anc = ancestralPct(changes);
      
      let barLabel, barPct, isAncestral;
      if (topChange === null || anc > topChange.pct) {
        barLabel = "ancestral (no change)";
        barPct = anc;
        isAncestral = true;
      } else {
        barLabel = topChange.change;
        barPct = topChange.pct;
        isAncestral = false;
      }
      
      let barClass = (family === "XFG") ? "bar" : "bar bar-cousin";
      if (isAncestral) {
        barClass += " bar-ancestral";
      }

      html += '<div class="row">';
      html += '<div class="label">' + family + " - " + barLabel + '</div>';
      html += '<div class="' + barClass + '" style="width:' + barPct + '%">' + barPct + '%</div>';
      html += '</div>';
    }

    card.innerHTML = html;
    figures.appendChild(card);
  }
</script>
</body>
</html>
