<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathogen Evolution Atlas </title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  .figure {
    border-top: 1.5px solid #090909;
    border-left: 1.5px solid #090909;
    padding: 20px 24px;
  }
  h2 { margin-bottom: 4px; }
  .row { margin: 12px 0; }
  .label { font-weight: bold; margin-bottom: 4px; }
  .bar {
    height: 28px;
    background: #4a90d9;
    color: white;
    border-radius: 4px;
    display: flex;
    align-items: center;
    padding-left: 8px;
    box-sizing: border-box;
    white-space: nowrap;
  }
  .bar-cousin { background: #b0b0b0; }
  .legend { 
    font-size: 14px;
    color: #090909;
    border-bottom: 1px solid #090909;
    padding: 0 24px 16px 24px;
    margin: 0 -24px 20px -24px;
  }
  .swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 4px;
    margin-left: 12px;
  }
  .swatch-xfg { background: #4a90d9; }
  .swatch-cousin { background: #b0b0b0; }
  #output { margin-top: 8px; }
  .caption { 
    font-size: 14px;
    color: #090909;
    line-height: 1.5;
    max-width: 600px;
    border-top: 1px solid #090909;
    padding: 16px 24px 0 24px;
    margin: 20px -24px 0 -24px;
  }
  #figures {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin-top: 20px;
    border-right: 1.5px solid #090909;
    border-bottom: 1.5px solid #090909;
  }
  .fignum {
    display: inline-block;
    background: #4a90d9;
    color: white;
    font-weight: bold;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    text-align: center;
    line-height: 24px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<h1>Pathogen Evolution Atlas</h1>
<p class="intro">XFG's distinguishing spike mutations versus its closest relatives (PQ, NB).</p>

<div id="figures"></div>

<script>
  // Stage 1: prove the grid lays out. Six placeholder cards, no real data yet.
  const figures = document.getElementById("figures");
  for (let n = 1; n <= 6; n++) {
    const card = document.createElement("div");
    card.className = "figure"
    card.innerHTML = '<div class="fignum">' + n + '</div>' +
                    '<p>Placeholder figure ' + n + '</p>';
    figures.appendChild(card);                
  }
</script>
</body>
</html>
