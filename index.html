<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathogen Evolution Atlas </title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  .figure {
    border-top: 1.5px solid #090909;
    border-left: 1.5px solid #090909;
    padding: 20px 24px;
  }
  h2 { margin-bottom: 4px; }
  .row { margin: 12px 0; }
  .label { font-weight: bold; margin-bottom: 4px; }
  .bar {
    height: 28px;
    background: #4a90d9;
    color: white;
    border-radius: 4px;
    display: flex;
    align-items: center;
    padding-left: 8px;
    box-sizing: border-box;
    white-space: nowrap;
  }
  .bar-cousin { background: #85c35f; }
  .legend { 
    font-size: 14px;
    color: #090909;
    border-bottom: 1px solid #090909;
    padding: 0 24px 16px 24px;
    margin: 0 -24px 20px -24px;
  }
  .swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 4px;
    margin-left: 12px;
  }
  .swatch-xfg { background: #4a90d9; }
  .swatch-cousin { background: #85c35f; }
  #output { margin-top: 8px; }
  .caption { 
    font-size: 14px;
    color: #090909;
    line-height: 1.5;
    max-width: 600px;
    border-top: 1px solid #090909;
    padding: 16px 24px 0 24px;
    margin: 20px -24px 0 -24px;
  }
  #figures {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin-top: 20px;
    border-right: 1.5px solid #090909;
    border-bottom: 1.5px solid #090909;
  }
  .fignum {
    display: inline-block;
    background: #4a90d9;
    color: white;
    font-weight: bold;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    text-align: center;
    line-height: 24px;
    margin-bottom: 8px;
  }
  .bar-ancestral { background: #d9d2c5; color: #444444; }
  .swatch-ancestral { background: #d9d2c5; }
  .grid-legend { font-size: 14px; color:#090909; margin: 8px 0 16px 0; }
  .rbd-track {
    position: relative;
    height: 40px;
    margin: 130px 0 40px 0;
  }
  .seg {
    position: absolute;
    top: 0;
    bottom: 0;
    box-sizing: border-box;
    border: 1px solid #999;
  }
  .seg-core { background: #e8e8e8; }
  .seg-rbm { background: #c5d9e8; }
  .seg-label {
    position: absolute;
    bottom: -20px;
    font-size: 10px;
    color: #555;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .rbm-region {
    position: absolute;
    top: 0;
    bottom: 0;
    background: #c5d9e8
  }
  .pos-dot {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 4px;
    transform: translateX(-50%);
    z-index: 2;
  }
  .pos-label {
    position: absolute;
    top: -22px;
    font-size: 11px;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .pos-line {
    position: absolute;
    width: 1px;
    background: #090909;
    bottom: 50%;
  }
  .pos-line-diagonal {
    transform: rotate(-20deg);
    transform-origin: bottom;
  }
  #captions {
    margin-top: 30px;
    font-size: 14px;
    line-height: 1.6;
    color: #090909
  }
  .caption-item {
    margin-bottom: 14px;
    display: flex;
    gap: 10px;
  }
  .caption-num {
    flex-shrink: 0;
    font-weight: bold;
    background: #4a90d9;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    text-align: center;
    line-height: 22px;
  }
</style>
</head>
<body>
<h1>Pathogen Evolution Atlas</h1>
<p class="intro">XFG's distinguishing spike mutations versus its closest relatives (PQ, NB).</p>

<div class="grid-legend">
  <span class="swatch swatch-xfg"></span> XFG (mutation present)
  <span class="swatch swatch-cousin"></span> PQ / NB (mutation present)
  <span class="swatch swatch-ancestral"></span> Ancestral residue (no change)
</div>

<div id="figures"></div>

<div id="captions"></div>

<script>
  fetch("data/site/residues.json")
    .then(response => response.json())
    .then(data => {
      const figures = document.getElementById("figures");
      figures.innerHTML = "";
      const positions = [487, 445, 478, 346, 444];
      positions.forEach((pos, index) => {
        drawCard(index + 1, pos, data);
      });
      drawSchematic(6);
      drawCaptions();
    })
    .catch(error => {
      document.getElementById("figures").innerHTML = "Error: " + error;
    });
    const captions = [
      "Position 487 (N487D): XFG carries N487D in 100% of sample genomes-a mutation it acquired as a recombinant lineage, beyond its LF.7 parent. PQ and NB show no change here, retaining the ancestral asparagine. N487 sits within the receptor-binding motif, at a residue that is know to contact the ACE2 receptor, making this one of XFG's most distinctive markers.",
      "Position 445 (V445R): All three lineages mutate position 445, but to different residues—XFg to arginine (V445R), while PQ and NB converge on histidine (V445H). This is convergent evolution: the same site under selective pressure, resolved differently by each lineage.",
      "Position 478 (T478K): XFG retains the ancestral lysine (T478K) in 100% of sample genomes, while PQ and NB have diverged to isoleucine (T478I). Position 478 is hightly variable across recent JN.1 descendants, so XFG's conservation here distinguises it from its close relatives—and example of XFG standing still while others changed.",
      "Position 346 (R346T): XFG carries R346T, an escape mutation inherited from its LF.7 lineage. Its relatives largely lack this change—PQ retains the ancestral residue in most genomes, and NB carries a different substitution (R346K)—reflecting their separate lineage origins.",
      "Position 444 (K444R): XFG carries K444R in nearly all sampled genomes, another escape mutation from its LF.7 ancestry. PQ and NB retain the ancestral residue at this antibody-binding position, distinguishing XFG here.]",
      "RBD position map: [The five distinguishing positions mapped onto the spike receptor-binding domain (RBd, residues 333-526). Four of the five fall within or adjacent to the receptor-binding domain (RBD, residues 333-526). Four of the five fall within or adjacent to the receptor-binding motif (RBM, 438-506), the region that makes contact with the ACE2 receptor and concentrates antibody-escape pressure—indicating XFG's distinguishing changes are focused at the functional binding interface."
    ]
  
  function drawCaptions() {
    const box = document.getElementById("captions");
    let html = "";
    captions.forEach((text,index) => {
      html += '<div class="caption-item">';
      html += '<div class="caption-num">' + (index + 1) + '</div>';
      html += '<div>' + text + '</div>';
      html += '</div>';
    });
    box.innerHTML = html;
  }

  function dominant(changes) {
    if (changes.length === 0) {
      return null;
    }
    let top = changes[0];
    for (const item of changes) {
      if (item.pct > top.pct) {
        top = item;
      }
    }
    return top;
  }
  function ancestralPct(changes) {
    let sum = 0
    for (const item of changes) {
      sum += item.pct;
    }
    return Math.round((100 - sum) * 10/ 10);
  }

  function drawCard(figNum, position, data) {
    const posData = data[position];
    const figures = document.getElementById("figures");
    const card = document.createElement("div");
    card.className = "figure";

    let html = '<div class="fignum">' + figNum + '</div>';
    html += '<div class="label">Position ' + position + '</div>';

    for (const family of ["XFG", "PQ", "NB"]) {
      const changes = posData[family].changes;
      const topChange = dominant(changes);
      const anc = ancestralPct(changes);
      
      let barLabel, barPct, isAncestral;
      if (topChange === null || anc > topChange.pct) {
        barLabel = "ancestral (no change)";
        barPct = anc;
        isAncestral = true;
      } else {
        barLabel = topChange.change;
        barPct = topChange.pct;
        isAncestral = false;
      }
      
      let barClass = (family === "XFG") ? "bar" : "bar bar-cousin";
      if (isAncestral) {
        barClass += " bar-ancestral";
      }

      html += '<div class="row">';
      html += '<div class="label">' + family + " - " + barLabel + '</div>';
      html += '<div class="' + barClass + '" style="width:' + barPct + '%">' + barPct + '%</div>';
      html += '</div>';
    }

    card.innerHTML = html;
    figures.appendChild(card);
  }
  function drawSchematic(figNum) {
    const RBD_START = 333;
    const RBD_END = 526;
    const RBM_START = 438;
    const RBM_END = 506;

    function toPercent(pos) {
      return (pos - RBD_START) / (RBD_END - RBD_START) * 100;
    }

    const figures = document.getElementById("figures");
    const card = document.createElement("div");
    card.className = "figure";

    let html = '<div class="fignum">' + figNum + '</div>';
    html += '<div class="label">RBD position map (spike ' + RBD_START + '-' + RBD_END + ')</div>';

    html += '<div class="rbd-track">';

    const rbmLeft = toPercent(RBM_START);
    const rbmRight = toPercent(RBM_END);

    // Three segments: core (left), RBM (middle), core (right)
    html += '<div class="seg seg-core" style="left:0%; width:' + rbmLeft + '%"></div>';
    html += '<div class="seg seg-rbm" style="left:' + rbmLeft + '%; width:' + (rbmRight - rbmLeft) + '%"></div>';
    html += '<div class="seg seg-core" style="left:' + rbmRight + '%; width:' + (100 - rbmRight) + '%"></div>';

    // Segment labels
    html += '<div class="seg-label" style="left:' + (rbmLeft / 2) + '%">RBD core</div>';
    html += '<div class="seg-label" style="left:' + ((rbmLeft + rbmRight) / 2) + '%">RBM (438-506)</div>';

    // Position markers
    const mapped = [487, 445, 478, 346, 444];
    const heights = [70, 30, 50, 50, 60];
    const colors = ["#4a90d9", "#e07b39", "#5cb85c", "#e04a6d", "#9b59b6"];
    mapped.forEach((pos, index) => {
      const left = toPercent(pos);
      const lineHeight = heights[index % heights.length];
      const color = colors[index];

      let nudge = 0;
      if (pos === 444) nudge = -1;
      if (pos === 445) nudge = 1;
      html += '<div class="pos-dot" style="left:calc(' + left + '% + ' + nudge + 'px); background:' + color + '"></div>';

      if (pos === 444) {
        html += '<div class="pos-line pos-line-diagonal" style="left:' + left + '%; height:' + lineHeight + 'px"></div>';
        html += '<div class="pos-label" style="left:calc(' + left + '% - 20px); bottom:' + (lineHeight + 22) + 'px; top:auto">' + pos + '</div>';
      } else {
        html += '<div class="pos-line" style="left:' + left + '%; height:' + lineHeight + 'px"></div>';
        html += '<div class="pos-label" style="left:' + left + '%; bottom:' + (lineHeight + 22) + 'px; top:auto">' + pos + '</div>';
      }
    });

    html += '</div>';

    card.innerHTML = html;
    figures.appendChild(card);
  }
</script>
</body>
</html>
